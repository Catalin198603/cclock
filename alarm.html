<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Set and manage multiple online alarms with cClock."><meta name="robots" content="index, follow"><title>Online Alarm Clock - Set Multiple Alarms | cClock</title><link rel="stylesheet" href="styles-v3.css"><style>
.alarm-page{max-width:1180px;margin:0 auto;padding:42px 20px 70px}.alarm-page-head{text-align:center;margin-bottom:30px}.alarm-page-head h1{font-size:clamp(2.2rem,5vw,4rem);margin:8px 0}.alarm-page-head p{color:var(--muted)}.alarm-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.alarm-row{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}.alarm-name{font-weight:800}.alarm-row input[type=time]{width:150px;padding:11px;background:#0b0f14;color:#fff;border:1px solid #303944;border-radius:9px;font-size:18px;color-scheme:dark}.switch{position:relative;width:52px;height:29px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#303944;border-radius:30px;cursor:pointer}.slider:before{content:"";position:absolute;width:21px;height:21px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:var(--orange)}.switch input:checked+.slider:before{transform:translateX(23px)}.alarm-summary{margin-top:22px;padding:18px;border:1px solid var(--line);border-radius:14px;color:var(--muted);text-align:center}.back-home{display:inline-block;margin-top:26px;color:var(--orange);font-weight:800;text-decoration:none}body.light .alarm-row{background:#fff}body.light .alarm-row input[type=time]{background:#fff;color:#101318;color-scheme:light}@media(max-width:760px){.alarm-list{grid-template-columns:1fr}}@media(max-width:480px){.alarm-row{grid-template-columns:90px 1fr auto;padding:15px 12px}.alarm-row input[type=time]{width:125px}}
</style></head><body><header class="topbar"><a class="brand" href="index.html"><span>c</span>Clock</a><nav class="main-nav"><a class="nav-link" href="index.html">Clock</a><span class="nav-link active">Alarm</span></nav><div class="top-actions"><button id="theme-toggle" class="icon-btn">☾</button><button id="toggle-format" class="compact-btn">24H</button></div></header>
<main class="alarm-page"><div class="alarm-page-head"><p class="section-kicker">MULTIPLE ALARMS</p><h1>Alarm Clock</h1><p>Set up to 8 alarms for different times. Activate only the alarms you need.</p></div><div class="alarm-list" id="alarm-list"></div><div class="alarm-summary" id="alarm-summary">No alarms active.</div><a class="back-home" href="index.html">← Back to cClock</a></main><audio id="alarm-audio" src="alarm.mp3" preload="auto"></audio>
<script>
const list=document.getElementById('alarm-list'),summary=document.getElementById('alarm-summary'),audio=document.getElementById('alarm-audio');let hour24=true;
for(let i=1;i<=8;i++){const row=document.createElement('div');row.className='alarm-row';row.innerHTML='<div class="alarm-name">Alarm '+i+'</div><input type="time" step="60" aria-label="Alarm '+i+' time"><label class="switch"><input type="checkbox" aria-label="Activate Alarm '+i+'"><span class="slider"></span></label>';list.appendChild(row)}
function save(){const data=[...document.querySelectorAll('.alarm-row')].map(r=>({time:r.querySelector('input[type=time]').value,on:r.querySelector('input[type=checkbox]').checked}));localStorage.setItem('cclock-alarms',JSON.stringify(data));renderSummary()}
function load(){try{const data=JSON.parse(localStorage.getItem('cclock-alarms')||'[]');[...document.querySelectorAll('.alarm-row')].forEach((r,i)=>{if(data[i]){r.querySelector('input[type=time]').value=data[i].time||'';r.querySelector('input[type=checkbox]').checked=!!data[i].on}})}catch(e){}renderSummary()}
function renderSummary(){const active=[...document.querySelectorAll('.alarm-row')].filter(r=>r.querySelector('input[type=checkbox]').checked&&r.querySelector('input[type=time]').value).map(r=>r.querySelector('.alarm-name').textContent+' — '+r.querySelector('input[type=time]').value);summary.textContent=active.length?'Active: '+active.join(' • '):'No alarms active.'}
list.addEventListener('change',save);let last='';setInterval(()=>{const now=new Date(),key=now.toDateString()+'-'+now.getHours()+':'+now.getMinutes();if(key===last)return;const hh=String(now.getHours()).padStart(2,'0'),mm=String(now.getMinutes()).padStart(2,'0'),current=hh+':'+mm;const hit=[...document.querySelectorAll('.alarm-row')].find(r=>r.querySelector('input[type=checkbox]').checked&&r.querySelector('input[type=time]').value===current);if(hit){last=key;audio.loop=true;audio.play().catch(()=>{});summary.innerHTML='<strong>'+hit.querySelector('.alarm-name').textContent+' is ringing!</strong> <button id="stop-ring" class="secondary-btn">Stop</button>';document.getElementById('stop-ring').onclick=()=>{audio.pause();audio.currentTime=0;audio.loop=false;renderSummary()}}},1000);
document.getElementById('theme-toggle').onclick=function(){document.body.classList.toggle('light');this.textContent=document.body.classList.contains('light')?'☀':'☾'};document.getElementById('toggle-format').onclick=function(){hour24=!hour24;this.textContent=hour24?'24H':'12H'};load();
</script></body></html>
